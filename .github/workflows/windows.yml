name: windows

# Manual only while the port is in alpha: a clang-cl build is the slowest job
# by far, and running it on every push held up each release. Start it from the
# Actions tab or with `gh workflow run windows.yml --ref port` when a Windows
# zip is wanted. Restore the push/pull_request triggers to run it on every push.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ runner.os }}-clangcl

      # Configure downloads and unpacks about a dozen dependencies. Keep the
      # unpacked sources and the stamps that say they are current; the build
      # directories beside them are left out, since ccache covers those.
      - uses: actions/cache@v4
        with:
          path: |
            build-win/_deps/*-src
            build-win/_deps/*-subbuild
          key: deps-windows-${{ hashFiles('CMakeLists.txt', 'extern/aurora/**/CMakeLists.txt', 'extern/aurora/**/*.cmake') }}

      - name: Configure
        run: >
          cmake -S . -B build-win -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang-cl
          -DCMAKE_CXX_COMPILER=clang-cl
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DAURORA_ENABLE_TESTS=ON
          -DMP_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build-win -j

      - name: Test
        run: ctest --test-dir build-win -L port --output-on-failure

      # ctest only prints a test's output when it fails, so the wss:// evidence
      # - the verified handshake and the rejections - would otherwise never
      # appear in the log. Run it once more directly to record it.
      - name: Show the TLS handshake result
        run: ./build-win/port_ws_tests.exe

      - name: Build FIFO regressions
        run: cmake --build build-win --target gx_fifo_tests -j

      - name: Test FIFO regressions
        run: ./build-win/extern/aurora/tests/gx_fifo_tests.exe --gtest_brief=1

      # The Remastered import decodes that game's H.264 movies with ffmpeg, run
      # as a separate program, and Windows has none of its own. The package
      # carries a small LGPL build made here from the official source: the
      # H.264 decoder and the JPEG encoder, nothing else. Rebuilt only when
      # the script changes.
      - uses: actions/cache@v4
        id: ffmpeg
        with:
          path: ffmpeg-min/out
          key: ffmpeg-min-${{ hashFiles('tools/build_ffmpeg_min.sh') }}

      - uses: msys2/setup-msys2@v2
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        with:
          msystem: MINGW64
          install: make diffutils tar xz curl mingw-w64-x86_64-gcc mingw-w64-x86_64-nasm

      # Linked statically and on Win32 threads, so the program needs no
      # MinGW runtime DLL beside it.
      - name: Build ffmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          bash tools/build_ffmpeg_min.sh ffmpeg-min --disable-pthreads --enable-w32threads --extra-ldflags=-static
          mkdir -p ffmpeg-min/out
          cp ffmpeg-min/ffmpeg.exe ffmpeg-min/COPYING.LGPLv2.1 ffmpeg-min/ffmpeg-build.txt ffmpeg-min/out/

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build-win/metroid_prime_port.exe dist/
          Copy-Item build-win/initial_pipeline_cache.db dist/
          Get-ChildItem build-win/*.dll | Copy-Item -Destination dist/
          if (Test-Path build-win/metroid_prime_port.pdb) { Copy-Item build-win/metroid_prime_port.pdb dist/ }
          # find_package(OpenSSL) links the runner's own OpenSSL through import
          # libraries, so its DLLs are not in build-win and have to be taken
          # from that install. Without them the zip fails to start on any
          # machine that has no OpenSSL of its own.
          $include = (Select-String -Path build-win/CMakeCache.txt -Pattern '^OPENSSL_INCLUDE_DIR:[A-Z]+=(.+)$').Matches[0].Groups[1].Value
          if ($include -and -not $include.EndsWith('-NOTFOUND')) {
            $root = Split-Path $include
            foreach ($name in 'libcrypto-3-x64.dll', 'libssl-3-x64.dll') {
              $dll = @("$root/bin/$name", "$root/$name") | Where-Object { Test-Path $_ } | Select-Object -First 1
              if (-not $dll) { throw "$name not found under $root" }
              Copy-Item $dll dist/
            }
          }
          # The HD texture and button-prompt sets live next to the executable
          # (DefaultTexturesPath); without them the zip shows GameCube prompts
          # only. The post-build step puts them in build-win/textures.
          if (-not (Test-Path build-win/textures/keyboard)) { throw 'build-win/textures missing' }
          Copy-Item -Recurse build-win/textures dist/textures
          New-Item -ItemType Directory -Force -Path dist/licenses | Out-Null
          # The port's own grant and notice travel with the package too.
          Copy-Item LICENSE dist/licenses/port-license.txt
          Copy-Item NOTICE dist/licenses/port-notice.txt
          Copy-Item extern/aurora/LICENSE dist/licenses/aurora.txt
          Copy-Item extern/musyx/LICENSE dist/licenses/musyx.txt
          Copy-Item extern/astcenc/LICENSE.txt dist/licenses/astcenc.txt
          Copy-Item docs/NATIVE_PORT.md dist/README.md
          # ffmpeg is its own program under the LGPL: its licence, and where
          # its source and build line are, go with it.
          Copy-Item ffmpeg-min/out/ffmpeg.exe dist/
          Copy-Item ffmpeg-min/out/COPYING.LGPLv2.1 dist/licenses/ffmpeg-LGPL-2.1.txt
          Copy-Item ffmpeg-min/out/ffmpeg-build.txt dist/licenses/ffmpeg.txt
          # Keep notices supplied by the fetched runtime packages too.
          Get-ChildItem build-win/_deps -Recurse -File -Include LICENSE*,COPYING*,NOTICE* |
            ForEach-Object {
              $relative = [System.IO.Path]::GetRelativePath((Resolve-Path build-win/_deps), $_.FullName)
              $destination = Join-Path dist/licenses $relative
              New-Item -ItemType Directory -Force -Path (Split-Path $destination) | Out-Null
              Copy-Item $_.FullName $destination
            }
          if (Test-Path dist/libcrypto-3-x64.dll) {
            $license = @("$root/license.txt", "$root/LICENSE.txt") | Where-Object { Test-Path $_ } | Select-Object -First 1
            if ($license) { Copy-Item $license dist/licenses/openssl.txt }
            else { Invoke-WebRequest https://raw.githubusercontent.com/openssl/openssl/openssl-3.5/LICENSE.txt -OutFile dist/licenses/openssl.txt }
          }

      # The runner has OpenSSL and other runtimes on PATH, which hid a DLL
      # missing from the package. Start it with the system directories only, as
      # a player's machine would.
      - name: Check packaged startup
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          # The bundled ffmpeg must start the same way, and be the build the
          # movie import needs.
          $decoders = & ./dist/ffmpeg.exe -hide_banner -decoders
          if ($LASTEXITCODE -ne 0) { throw 'Packaged ffmpeg did not start' }
          if (-not ($decoders | Select-String -Pattern '\bh264\b')) { throw 'Packaged ffmpeg has no H.264 decoder' }
          # With no disc the game opens a file dialog, which nobody answers
          # here: it used to hold the job for its whole five minute timeout.
          $env:MP_NO_DISC_DIALOG = "1"
          $process = Start-Process -FilePath ./dist/metroid_prime_port.exe -WorkingDirectory ./dist -Wait -PassThru -RedirectStandardError ./startup-error.log
          if ($process.ExitCode -ne 1) { throw "Unexpected exit code: $($process.ExitCode)" }
          if (-not (Select-String -Path ./startup-error.log -Pattern 'no disc image given')) { throw 'Packaged executable did not reach main' }
          # The run above left its log and caches in dist. Ship none of them:
          # copied over an install, a cache file without its old -wal/-shm
          # reads as malformed and feeds Dawn bad pipeline blobs.
          Remove-Item -Force -ErrorAction SilentlyContinue ./dist/metroid_prime_port.log, ./dist/dawn_cache.db*, ./dist/pipeline_cache.db*

      - uses: actions/upload-artifact@v4
        with:
          name: metroid_prime_port-windows
          path: dist
