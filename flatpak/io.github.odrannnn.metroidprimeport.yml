# Flatpak manifest for the port.
#
# Unlike the AppImage, a Flatpak does not depend on the host's glibc: it comes
# from the runtime below, so the binary only has to be built against that. The
# GPU driver still comes from the host through the usual extensions, which is
# what we want.
#
# Build with tools/make_flatpak.sh. The app id is io.github.odrannnn.metroidprimeport,
# which is a domain the maintainer controls, as Flathub requires.
app-id: io.github.odrannnn.metroidprimeport
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: metroid_prime_port

finish-args:
  # Vulkan goes through the DRM device.
  - --device=dri
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # The disc image lives wherever the user keeps it; it is read-only to us.
  - --filesystem=home:ro
  # The update check (api.github.com) and Archipelago servers.
  - --share=network
  # Discord Rich Presence (off by default): the native and Flatpak Discord
  # clients' IPC sockets.
  - --filesystem=xdg-run/discord-ipc-0
  - --filesystem=xdg-run/app/com.discordapp.Discord:create

modules:
  - name: metroid-prime-port
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DMP_BUILD_TESTS=OFF
      # Aurora has its own tests, on its own switch, defaulting to ON, and they
      # FetchContent googletest - which a release package has no reason to build
      # and no way to download offline. MP_BUILD_TESTS=OFF only covers the port's
      # own tests; without this the build died fetching googletest.
      - -DAURORA_ENABLE_TESTS=OFF
      # A Flatpak build is offline: the sandbox shares no resolver, so anything
      # the build would FetchContent has to be handed to it as a source below and
      # pointed at here. Three of them reach the network on Linux. AURORA_SDL3_PROVIDER
      # resolving to `vendor` does NOT mean SDL3 ships in this repository - it
      # means Aurora vendors it through FetchContent, which is still a download;
      # the tree has no SDL3 in it. The Android OpenSSL source is the one that
      # does not apply here, because that file is inside if(ANDROID).
      - -DFETCHCONTENT_SOURCE_DIR_DAWN_PREBUILT=/run/build/metroid-prime-port/dawn_prebuilt
      - -DFETCHCONTENT_SOURCE_DIR_NOD_PREBUILT=/run/build/metroid-prime-port/nod_prebuilt
      - -DFETCHCONTENT_SOURCE_DIR_SDL=/run/build/metroid-prime-port/sdl-src
      - -DFETCHCONTENT_SOURCE_DIR_ABSEIL-CPP=/run/build/metroid-prime-port/abseil-cpp
      - -DFETCHCONTENT_SOURCE_DIR_XXHASH=/run/build/metroid-prime-port/xxhash
      - -DFETCHCONTENT_SOURCE_DIR_FMT=/run/build/metroid-prime-port/fmt
      - -DFETCHCONTENT_SOURCE_DIR_ZLIB=/run/build/metroid-prime-port/zlib
      - -DFETCHCONTENT_SOURCE_DIR_PNG=/run/build/metroid-prime-port/png
      - -DFETCHCONTENT_SOURCE_DIR_FREETYPE=/run/build/metroid-prime-port/freetype
      - -DFETCHCONTENT_SOURCE_DIR_IMGUI=/run/build/metroid-prime-port/imgui
      - -DFETCHCONTENT_SOURCE_DIR_SQLITE3=/run/build/metroid-prime-port/sqlite3
      - -DFETCHCONTENT_SOURCE_DIR_ZSTD=/run/build/metroid-prime-port/zstd
      - -DFETCHCONTENT_SOURCE_DIR_RMLUI=/run/build/metroid-prime-port/rmlui
      - -DFETCHCONTENT_SOURCE_DIR_TRACY=/run/build/metroid-prime-port/tracy
    post-install:
      # The binary, its data files, the desktop entry and the port's own grant
      # and notice are all installed by the project's own install rules, so
      # there is nothing here to put a binary in place. What is left is the
      # third-party notices: the two vendored snapshots come out of the tree,
      # and the fetched ones are collected here because they only exist once
      # cmake-ninja has run.
      # post-install runs in the build directory, not the source root, so every
      # path here is relative to it and reaches the source with a leading "..".
      # The first version used bare "extern/aurora/LICENSE" and died with
      # "install: cannot stat" - the file is tracked and present, just not
      # relative to where the script runs.
      - install -Dm644 ../extern/aurora/LICENSE /app/share/licenses/metroid-prime-port/aurora.txt
      - install -Dm644 ../extern/musyx/LICENSE /app/share/licenses/metroid-prime-port/musyx.txt
      - install -Dm644 ../extern/astcenc/LICENSE.txt /app/share/licenses/metroid-prime-port/astcenc.txt
      # The fetched dependencies were unpacked by this manifest into their own
      # directories at the source root, so that is where their notices are. The
      # previous loop looked in _deps/*-src, which is where FetchContent would
      # have put them had it been allowed to download, and which is empty now.
      - |
        for dir in ../*; do
            [ -d "$dir" ] || continue
            dep=$(basename "$dir")
            case "$dep" in _flatpak_build|_deps) continue ;; esac
            for notice in "$dir"/LICENSE* "$dir"/COPYING* "$dir"/LICENSE.txt; do
                [ -f "$notice" ] || continue
                install -Dm644 "$notice" /app/share/licenses/metroid-prime-port/$dep.txt
                break
            done
        done
      # The shared libraries come from the Flatpak runtime rather than out of
      # this build, so their terms cannot be collected here; they are named the
      # way the AppImage names the ones it copies off the build host.
      - |
        {
            echo "Shared libraries come from the Flatpak runtime, not from this"
            echo "build. Their licences are those of the runtime and the"
            echo "extensions it pulls in; see the runtime's own sources."
        } > /app/share/licenses/metroid-prime-port/BUNDLED_LIBRARIES.txt
    sources:
      # The repository itself. A git source keeps the build directory, disc
      # images and other untracked files out of the sandbox, which is the whole
      # reason this is a git source and not `type: dir`.
      #
      # The branch is named because flatpak-builder defaults to `master`, and
      # this repository has no `master`: its branches are `main` and `port`, with
      # the port's work on `port`. Leaving it unset failed the build with
      # "fatal: ambiguous argument 'master'" before compiling anything. Point
      # this at whatever branch a release is cut from when publishing.
      - type: git
        path: ..
        branch: port
      # Dawn and nod, pinned. Aurora fetches these with FetchContent and no hash
      # at all, which is acceptable for a developer build and not something a
      # published manifest should do: the digests below are what make this build
      # reproducible rather than whatever the release host serves that day.
      # Versions match AuroraDependencyVersions.cmake: Dawn v20260807.225922 and
      # nod v2.0.0-alpha.12.
      - type: archive
        url: https://github.com/encounter/dawn/releases/download/v20260807.225922/dawn-linux-x86_64.tar.gz
        sha256: 2a4523426ab9b3a8970b4e151c3b005304ad37c2c01bcff80c78fffe486fc768
        dest: dawn_prebuilt
      - type: archive
        url: https://github.com/encounter/nod/releases/download/v2.0.0-alpha.12/libnod-linux-x86_64.tar.gz
        sha256: 920adb1d2386c8728e0521f8d52809057c04bd46913433a0000ee0931d08d69f
        dest: nod_prebuilt
      # SDL3 3.4.10, matching AURORA_SDL3_REF (refs/tags/release-3.4.10). The
      # archive has an SDL-release-3.4.10/ wrapper, which FetchContent is happy
      # with, so it is not stripped.
      - type: archive
        url: https://github.com/libsdl-org/SDL/archive/refs/tags/release-3.4.10.tar.gz
        sha256: 0dc11d980ba17250200718fa4e28011da293f27ed92f92203afffe396811f307
        dest: sdl-src

      # The rest of Aurora's dependencies, transcribed from
      # extern/aurora/extern/CMakeLists.txt. Ten of the eleven digests are the
      # URL_HASH values already recorded there, so this adds no new trust in the
      # artefacts - it only moves the pins somewhere the build can see them.
      # abseil-cpp is the one the tree does not pin; its digest was computed from
      # the same tag the tree names (20240722.0).
      - type: archive
        url: https://github.com/abseil/abseil-cpp/archive/refs/tags/20240722.0.tar.gz
        sha256: f50e5ac311a81382da7fa75b97310e4b9006474f9560ac46f54a9967f07d4ae3
        dest: abseil-cpp

      - type: archive
        url: https://github.com/Cyan4973/xxHash/archive/refs/tags/v0.8.3.tar.gz
        sha256: aae608dfe8213dfd05d909a57718ef82f30722c392344583d3f39050c7f29a80
        dest: xxhash

      - type: archive
        url: https://github.com/fmtlib/fmt/archive/refs/tags/12.1.0.tar.gz
        sha256: ea7de4299689e12b6dddd392f9896f08fb0777ac7168897a244a6d6085043fea
        dest: fmt

      - type: archive
        url: https://github.com/zlib-ng/zlib-ng/archive/refs/tags/2.3.3.tar.gz
        sha256: f9c65aa9c852eb8255b636fd9f07ce1c406f061ec19a2e7d508b318ca0c907d1
        dest: zlib

      - type: archive
        url: https://github.com/pnggroup/libpng/archive/refs/tags/v1.6.58.tar.gz
        sha256: a9d4df463d36a6e5f9c29bd6f4967312d17e996c1854f3511f833924eb1993cf
        dest: png

      - type: archive
        url: https://files.twilitrealm.dev/freetype-2.14.3.tar.gz
        sha256: e61b31ab26358b946e767ed7eb7f4bb2e507da1cfefeb7a8861ace7fd5c899a1
        dest: freetype

      - type: archive
        url: https://github.com/ocornut/imgui/archive/refs/tags/v1.91.9b-docking.tar.gz
        sha256: 466fdef9b18de15f0bb6e288e3d00ffa3d82200ec458ce5e4f724a161d9528a5
        dest: imgui

      - type: archive
        url: https://sqlite.org/2026/sqlite-amalgamation-3510300.zip
        sha256: acb1e6f5d832484bf6d32b681e858c38add8b2acdfd42ac5df24b8afb46552b4
        dest: sqlite3

      - type: archive
        url: https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz
        sha256: eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3
        dest: zstd

      - type: archive
        url: https://github.com/mikke89/RmlUi/archive/0ae381e00d7426762bb5ed897973366358b16642.tar.gz
        sha256: fa4b84db1bae7b929996beb51d79b7037cd7aec438737a0df4d3c816d9b13bd8
        dest: rmlui

      - type: archive
        url: https://github.com/wolfpld/tracy/archive/refs/tags/v0.14.1.zip
        sha256: 908f3a2917fa86a247abfcf85dcf04bad1db6986a4d40f94b70512f3e9e98d5b
        dest: tracy
